name: Lab Doc Sync

on:
  pull_request:

permissions:
  contents: read

jobs:
  lab-doc-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Check README to _labs sync
        run: git diff --name-status --find-renames "${{ github.event.pull_request.base.sha }}...HEAD" | node scripts/check-lab-sync.js